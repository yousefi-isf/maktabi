services:
  postgres:
    image: postgres:18-alpine
    container_name: maktabi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maktabi
      POSTGRES_PASSWORD: maktabi_dev_pw
      POSTGRES_DB: maktabi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maktabi -d maktabi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: maktabi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: